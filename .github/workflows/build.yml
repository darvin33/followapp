
name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Create app
        run: |
          mkdir -p "Follower Watch.app/Contents/MacOS"
          cp .build/release/FollowerWatchMac "Follower Watch.app/Contents/MacOS/FollowerWatchMac"
          cat > "Follower Watch.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Follower Watch</string>
            <key>CFBundleIdentifier</key>
            <string>com.followerwatch.desktop</string>
            <key>CFBundleExecutable</key>
            <string>FollowerWatchMac</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent "Follower Watch.app" Follower-Watch-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Follower-Watch-macOS
          path: Follower-Watch-macOS.zip
